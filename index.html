<!DOCTYPE html>
<html lang="en">
	<head>
		<title>AvyOS</title>
	</head>
	<body>
		<div id="navbar">
			<p class="navbar-piece">AvyOS</p>
			<p class="navbar-piece">Having Fun!</p>
			<p class="navbar-piece" id="timeElement">Loading</p>
		</div>
		<div class="window" id="about">
			<div id="aboutheader" class="handle">
				<!-- Handle -->
				<button id="aboutclose" type="button" aria-label="Close About window"></button>
			</div>
			<h1>Welcome to AvyOS</h1>
			<h2>hi! I am Avy. I am a teenager from California</h2>
			<p>Hello world!</p>
			<img src="images/hi.jpeg" alt="penguin With a sign saying hi">
		</div>
		<div class="window" id="clock">
			<div id="clockheader" class="handle">
				<!-- Handle -->
				<button id="clockclose" type="button" aria-label="Close clock window"></button>
			</div>
			<div class="clock">
				<div class="clock-face">
					<div class="number number1">1</div>
					<div class="number number2">2</div>
					<div class="number number3">3</div>
					<div class="number number4">4</div>
					<div class="number number5">5</div>
					<div class="number number6">6</div>
					<div class="number number7">7</div>
					<div class="number number8">8</div>
					<div class="number number9">9</div>
					<div class="number number10">10</div>
					<div class="number number11">11</div>
					<div class="number number12">12</div>
					<div class="hand hour-hand" id="hour-hand"></div>
					<div class="hand minute-hand" id="minute-hand"></div>
					<div class="hand second-hand" id="second-hand"></div>
				</div>
			</div>
		</div>
		<div class="window" id="terminal">
			<div id="terminalheader" class="handle">
				<!-- Handle -->
				<button id="terminalclose" type="button" aria-label="Close terminal window"></button>
			</div>
			<div id="terminalWterm"></div>
		</div>
		<div class="window" id="weather" role="region" aria-label="Weather app">
			<div id="weatherheader" class="handle">
				<button id="weatherclose" type="button" aria-label="Close weather window"></button>
				<strong>Weather</strong>
			</div>
			<form id="weather-search" class="weather-search">
				<label for="weather-city">City</label>
				<div class="weather-search-row">
					<input id="weather-city" type="search" placeholder="Search for a city" value="San Francisco" required autocomplete="address-level2">
					<button type="submit">Search</button>
				</div>
			</form>
			<p id="weather-status" role="status" aria-live="polite"></p>
			<div id="weather-results" hidden>
				<h2 id="weather-location"></h2>
				<div class="weather-current">
					<span id="weather-temperature"></span>
					<span id="weather-condition"></span>
				</div>
				<p id="weather-details"></p>
				<h3>5-day forecast</h3>
				<ul id="weather-forecast"></ul>
				<p class="weather-credit">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
			</div>
		</div>
		<div id="desktopApps">
			<button id="aboutopen" class="desktop-icon" type="button" aria-label="Open About window">
				<img src="images/question.png" alt="question mark">
				<span>About</span>
			</button>
			<button id="clockopen" class="desktop-icon" type="button" aria-label="Open Clock window">
				<img src="images/clock.jpeg" alt="clock">
				<span>Clock</span>
			</button>
			<button id="terminalopen" class="desktop-icon" type="button" aria-label="Open terminal app">
				<img src="images/terminal.png" alt="terminal">
				<span>Terminal</span>
			</button>
			<button id="weatheropen" class="desktop-icon" type="button" aria-label="Open weather app">
				<img src="images/cloud.png" alt="cloud">
				<span>Weather</span>
			</button>
		</div>
		<script type="module" src="/script.js"></script>
	</body>
</html>
